
name: CI/CD

# Run the pipeline on every push to main
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: Test the application
  test:
    runs-on: ubuntu-latest

    # Temporary database password for CI only
    env:
      POSTGRES_PASSWORD: ci-test-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application with Docker Compose
        run: docker compose up -d --build --wait

      - name: Run Playwright tests
        run: npm test

      - name: Show Docker logs if tests fail
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # JOB 2: Build and publish Docker images
  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.multistage
          push: true
          tags: abdel380/auth-app:frontend

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: abdel380/auth-app:backend
